name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install build tooling
        run: pip install build

      - name: Check the tag matches the package version
        run: python scripts/release_notes.py --check-tag "$GITHUB_REF_NAME"

      - name: Build the wheel and source distribution
        run: python -m build

      - name: Extract release notes from the changelog
        run: python scripts/release_notes.py "$GITHUB_REF_NAME" > release-notes.md

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "OneMic ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            --verify-tag
