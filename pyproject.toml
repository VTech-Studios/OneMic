[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "onemic"
dynamic = ["version"]
description = "Blend any audio signals on Linux into one virtual microphone"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Luke McCann" }]
keywords = ["pipewire", "microphone", "audio", "mixer", "linux", "qt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Sound/Audio :: Mixers",
]
dependencies = ["PySide6>=6.11", "numpy>=2.0"]

[project.optional-dependencies]
dev = ["build>=1.3", "pytest>=9.1", "pytest-qt>=4.5", "pytest-cov>=7.1", "ruff>=0.16", "mypy>=2.3"]

[project.scripts]
onemic = "onemic.app:main"

[tool.setuptools.dynamic]
version = { attr = "onemic.__version__" }

[tool.setuptools.packages.find]
include = ["onemic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["onemic"]
branch = true
omit = ["onemic/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "SIM", "C4", "RET", "PTH", "PL", "RUF", "ERA", "D"]
ignore = [
    "D100", "D101", "D102", "D103", "D104", "D105", "D107",
    "D203", "D213", "D205", "D400", "D415",
    "PLR2004", "PLR0913",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004", "PLC0415"]
"onemic/ui/**" = ["N802"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["onemic", "tests"]

[[tool.mypy.overrides]]
module = ["PySide6.*", "shiboken6.*"]
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["pytestqt.*"]
ignore_missing_imports = true
